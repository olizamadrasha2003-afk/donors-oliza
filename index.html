<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জামি‘আতুল অলিজা ইসলামিয়া - দাতা সম্মেলন</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>জামি‘আতুল অলিজা ইসলামিয়া - দাতা সম্মেলন</h2>
    <div id="counterDisplay">মোট দাতা: ০ জন</div>
    
    <div class="top-controls">
        <input type="text" id="searchBox" placeholder="নাম, সদস্য নং বা মোবাইল লিখে খুঁজুন...">
        <button onclick="toggleFilterPanel()" class="action-btn">🔍 ফিল্টার মেনু</button>
        <button id="adminBtn" onclick="checkAdminPassword()" class="action-btn">⚙️ এডমিন প্যানেল</button>
    </div>

    <div id="filterPanel" class="filter-area" style="display: none;">
        <select id="idFilter"><option value="">সকল সদস্য নং</option></select>
        <select id="nameFilter"><option value="">সকল দাতার নাম</option></select>
        <select id="fatherFilter"><option value="">সকল পিতা</option></select>
        <select id="addressFilter"><option value="">সকল পরিচয়/ঠিকানা</option></select>
        <select id="mobileFilter"><option value="">সকল মোবাইল</option></select>
        <select id="genderFilter"><option value="">সকল লিঙ্গ (পুরুষ/মহিলা)</option></select>
        <select id="amountFilter"><option value="">সকল দানের পরিমাণ</option></select>
        <button onclick="resetFilters()">রিসেট ফিল্টার</button>
    </div>
</header>

<!-- এডমিন প্যানেল -->
<div id="adminPanel" class="admin-panel" style="display: none;">
    <span class="close-admin" onclick="toggleAdminPanel()">&times;</span>
    <h3>ডাটা ম্যানেজমেন্ট (এডমিন মোড)</h3>
    
    <div class="admin-select-box" style="margin-bottom: 10px;">
        <label for="selectDonorToEdit" style="font-size: 12px; font-weight: bold;">সংশোধন করতে দাতা সিলেক্ট করুন: </label>
        <select id="selectDonorToEdit" onchange="loadDonorForEdit(this.value)">
            <option value="">-- নতুন দাতা যুক্ত করতে খালি রাখুন --</option>
        </select>
    </div>

    <div class="form-group">
        <input type="number" id="adminId" placeholder="সদস্য নং (আইডি)">
        <input type="text" id="adminName" placeholder="দাতার নাম">
        <input type="text" id="adminFather" placeholder="পিতা">
        <input type="text" id="adminAddress" placeholder="পরিচয়/ঠিকানা">
        <input type="text" id="adminMobile" placeholder="মোবাইল">
        <select id="adminGender">
            <option value="পুরুষ">পুরুষ</option>
            <option value="মহিলা">মহিলা</option>
        </select>
        <input type="number" id="adminAmount" placeholder="দানের পরিমাণ">
        <button onclick="saveDonorData()" class="save-btn">সংরক্ষণ করুন (Save)</button>
    </div>
</div>

<div id="donorGrid" class="grid-container"></div>

<!-- ফুল স্ক্রিন জুম মোডাল -->
<div id="imageModal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <div id="zoomContainer">
        <img id="modalImg" src="" alt="Zoom Image">
    </div>
    <div class="modal-controls">
        <h3 id="modalCaption"></h3>
        <p style="font-size: 11px; color: #ccc;">(কোথাও ক্লিক করলে বন্ধ হয়ে যাবে)</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
